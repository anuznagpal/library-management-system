<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Book</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
<div class="container my-5">
    <h3>Add Book</h3>
    <form action="#" th:action="@{/saveBook}" th:object="${book}" method="POST">
        <input type="text" th:field="*{title}" placeholder="Book Title" class="form-control mb-4 col-4">
        <input type="text" th:field="*{author}" placeholder="Author" class="form-control mb-4 col-4">
        <input type="text" th:field="*{isbn}" placeholder="ISBN" class="form-control mb-4 col-4">
        <button type="submit" class="btn btn-info col-2">Save Book</button>
    </form>
</div>
</body>
</html>
